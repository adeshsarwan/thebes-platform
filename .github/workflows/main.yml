name: Thebes Platform CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thebes-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show repository information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch or ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Triggered by: $GITHUB_ACTOR"

      - name: Check for unresolved merge markers
        run: |
          if grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=vendor \
            -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo "Unresolved merge markers were found."
            exit 1
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './vendor' -prune -o \
              -name '*.json' -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JSON files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Validating $file"
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check pyyaml

          python3 <<'PY'
          from pathlib import Path
          import sys
          import yaml

          ignored = {".git", "node_modules", "vendor"}
          files = []

          for suffix in ("*.yml", "*.yaml"):
              for path in Path(".").rglob(suffix):
                  if any(part in ignored for part in path.parts):
                      continue
                  files.append(path)

          if not files:
              print("No YAML files found.")
              raise SystemExit(0)

          failed = False

          for path in sorted(set(files)):
              print(f"Validating {path}")
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      list(yaml.safe_load_all(handle))
              except Exception as exc:
                  failed = True
                  print(f"ERROR in {path}: {exc}", file=sys.stderr)

          raise SystemExit(1 if failed else 0)
          PY

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './vendor' -prune -o \
              -name '*.sh' -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Checking $file"
            bash -n "$file"
          done

      - name: Check required project documentation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::warning file=$file::Recommended project file is missing."
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "Required project documentation is present."
          fi

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Thebes Platform CI"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Workflow: bootstrap repository validation"
            echo
            echo "This workflow validates repository structure and configuration."
            echo "Application-specific tests will be added after the technology stack is confirmed."
          } >> "$GITHUB_STEP_SUMMARY"
